<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智服流｜智能客服工作台</title>
   <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .container {
      width: min(900px, 92%);
      margin: 50px auto;
    }

    .header {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      color: #1d4ed8;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(31, 41, 55, 0.08);
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 10px;
    }

   textarea {
  width: 100%;
  min-height: 100px;
  padding: 14px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 16px;
  resize: vertical;
}

input,
select {
  width: 100%;
  padding: 14px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 16px;
  margin-bottom: 14px;
}

    button {
      margin-top: 14px;
      padding: 11px 20px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #status {
      color: #64748b;
    }

    #answer {
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .source {
      display: inline-block;
      padding: 6px 10px;
      margin: 5px 5px 0 0;
      border-radius: 999px;
      background: #dbeafe;
      color: #1d4ed8;
    }

    .hidden {
      display: none;
    }
     .ticket-item {
  margin-top: 12px;
  padding: 14px;
  border-left: 4px solid #2563eb;
  border-radius: 8px;
  background: #eff6ff;
  line-height: 1.7;
}
.status-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 700;
}

.status-pending {
  background: #fef3c7;
  color: #92400e;
}

.status-processing {
  background: #dbeafe;
  color: #1d4ed8;
}

.status-resolved {
  background: #dcfce7;
  color: #166534;
}

.ticket-actions button {
  margin-right: 8px;
}
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>智服流 · 智能客服工作台</h1>
      <p>基于企业知识库的客服问答与工单协同系统</p>
    </header>

    <section class="card">
      <label for="question">请输入客户问题</label>
      <textarea id="question" placeholder="例如：物流超过 48 小时没有更新怎么办？"></textarea>
      <button id="askButton">智能回答</button>
    </section>

    <section id="resultCard" class="card hidden">
      <h2>回答结果</h2>
      <p id="status"></p>
      <div id="answer"></div>

      <h3 id="sourcesTitle">回答依据</h3>
      <div id="sources"></div>
 <hr />

<h3>需要人工处理？</h3>

<label for="customerName">客户姓名</label>
<input id="customerName" type="text" placeholder="请输入客户姓名" />

<label for="orderNo">订单号（可选）</label>
<input id="orderNo" type="text" placeholder="例如：ZF20260831001" />

<label for="priority">工单优先级</label>
<select id="priority">
  <option value="low">低</option>
  <option value="medium" selected>中</option>
  <option value="high">高</option>
</select>

<button id="createTicketButton">转人工并创建工单</button>
<p id="ticketMessage"></p>
    </section>
<section class="card">
  <h2>工单管理</h2>
  <p>查看已创建的人工处理工单。</p>

  <button id="loadTicketsButton">刷新工单列表</button>
  <div id="ticketList"></div>
</section>
  </main>

  <script>
    const questionInput = document.getElementById("question");
    const askButton = document.getElementById("askButton");
    const resultCard = document.getElementById("resultCard");
    const status = document.getElementById("status");
    const answer = document.getElementById("answer");
    const sources = document.getElementById("sources");
    const sourcesTitle = document.getElementById("sourcesTitle");
    const customerNameInput = document.getElementById("customerName");
    const orderNoInput = document.getElementById("orderNo");
    const priorityInput = document.getElementById("priority");
    const createTicketButton = document.getElementById("createTicketButton");
    const ticketMessage = document.getElementById("ticketMessage");
    const loadTicketsButton = document.getElementById("loadTicketsButton");
    const ticketList = document.getElementById("ticketList");

    askButton.addEventListener("click", async () => {
      const question = questionInput.value.trim();

      if (!question) {
        alert("请先输入一个问题");
        return;
      }

      askButton.disabled = true;
      askButton.textContent = "正在查询...";
      resultCard.classList.remove("hidden");
      status.textContent = "正在检索知识库并生成回答...";
      answer.textContent = "";
      sources.innerHTML = "";
      sourcesTitle.classList.add("hidden");

      try {
        const response = await fetch(
          `/knowledge/llm-answer?query=${encodeURIComponent(question)}`
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "请求失败");
        }

        answer.textContent = data.answer;
        status.textContent = data.grounded
          ? "回答已依据知识库生成"
          : "知识库未覆盖该问题，建议转人工客服";

       if (data.sources.length > 0) {
  sourcesTitle.classList.remove("hidden");

  data.sources.forEach((source) => {
    const tag = document.createElement("span");
    tag.className = "source";
    tag.textContent = source;
    sources.appendChild(tag);
  });
}
      } catch (error) {
        status.textContent = "调用失败";
        answer.textContent = error.message;
      } finally {
        askButton.disabled = false;
        askButton.textContent = "智能回答";
      }
    });
    createTicketButton.addEventListener("click", async () => {
  const customerName = customerNameInput.value.trim();
  const question = questionInput.value.trim();

  if (!customerName) {
    ticketMessage.textContent = "请填写客户姓名";
    return;
  }

  createTicketButton.disabled = true;
  createTicketButton.textContent = "正在创建...";
  ticketMessage.textContent = "";

  try {
    const response = await fetch("/tickets", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        customer_name: customerName,
        question: question,
        order_no: orderNoInput.value.trim() || null,
        priority: priorityInput.value
      })
    });

    const ticket = await response.json();

    if (!response.ok) {
      throw new Error(ticket.detail || "工单创建失败");
    }

    ticketMessage.textContent = `工单创建成功，编号：#${ticket.id}`;
    customerNameInput.value = "";
    orderNoInput.value = "";
    await loadTickets();
  } catch (error) {
    ticketMessage.textContent = `创建失败：${error.message}`;
  } finally {
    createTicketButton.disabled = false;
    createTicketButton.textContent = "转人工并创建工单";
  }
});
async function updateTicketStatus(ticketId, status) {
  try {
    const response = await fetch(`/tickets/${ticketId}`, {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        status: status
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.detail || "更新状态失败");
    }

    await loadTickets();
  } catch (error) {
    alert(`状态更新失败：${error.message}`);
  }
}
async function loadTickets() {
  loadTicketsButton.disabled = true;
  loadTicketsButton.textContent = "正在加载...";
  ticketList.textContent = "";

  try {
    const response = await fetch("/tickets");
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.detail || "获取工单失败");
    }

    if (data.items.length === 0) {
      ticketList.textContent = "当前没有工单";
      return;
    }

    data.items.forEach((ticket) => {
      const item = document.createElement("div");
      item.className = "ticket-item";

 const statusMap = {
  pending: "待处理",
  processing: "处理中",
  resolved: "已解决"
};

const statusClassMap = {
  pending: "status-pending",
  processing: "status-processing",
  resolved: "status-resolved"
};

const info = document.createElement("p");
info.append(`工单 #${ticket.id}｜客户：${ticket.customer_name}｜优先级：${ticket.priority}｜状态：`);

const statusBadge = document.createElement("span");
statusBadge.className = `status-badge ${statusClassMap[ticket.status]}`;
statusBadge.textContent = statusMap[ticket.status];

info.appendChild(statusBadge);
info.append(`｜问题：${ticket.question}`);

const actions = document.createElement("div");
actions.className = "ticket-actions";

if (ticket.status === "pending") {
  const processingButton = document.createElement("button");
  processingButton.textContent = "标记处理中";
  processingButton.addEventListener("click", () => {
    updateTicketStatus(ticket.id, "processing");
  });
  actions.appendChild(processingButton);
}

if (ticket.status !== "resolved") {
  const resolvedButton = document.createElement("button");
  resolvedButton.textContent = "标记已解决";
  resolvedButton.addEventListener("click", () => {
    updateTicketStatus(ticket.id, "resolved");
  });
  actions.appendChild(resolvedButton);
}

item.appendChild(info);
item.appendChild(actions);
ticketList.appendChild(item);
    });
  } catch (error) {
    ticketList.textContent = `加载失败：${error.message}`;
  } finally {
    loadTicketsButton.disabled = false;
    loadTicketsButton.textContent = "刷新工单列表";
  }
}

loadTicketsButton.addEventListener("click", loadTickets);
  </script>
</body>
</html>
